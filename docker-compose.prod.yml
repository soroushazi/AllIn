# Production deploy - Oracle Cloud ARM Ampere A1 instance.
# The plain docker-compose.yml stays the local dev setup (Postgres + backend
# on runserver, frontend served separately by `npm run dev`); this file is
# additive/separate, not an override of it. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published - only `backend` reaches this, over the compose
    # network, unlike local dev which exposes 5432 for convenience.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # --timeout 200: gunicorn's default worker timeout is 30s, but the
    # import pipeline's batched Ollama category-resolution call
    # (resolve_categories_via_llm, services.py) uses a 180s request timeout
    # of its own - a larger import (more never-before-seen merchants in one
    # upload) can genuinely take that long. Without this flag gunicorn
    # silently kills the worker mid-request on any upload whose LLM call
    # runs past 30s, surfacing as a bare 500 with no detail (DEBUG=false in
    # prod) - confirmed as the cause of the "works split into weekly files,
    # fails as one larger file" report, 2026-09-25. 200s gives headroom over
    # both that 180s call and voice capture's 90s Ollama call on the same
    # workers.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 200"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3}
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    volumes:
      - whisper_cache:/root/.cache/huggingface
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - frontend_dist:/output

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  whisper_cache:
  static_files:
  frontend_dist:
  caddy_data:
  caddy_config:
